name: Validate workspace manifest

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate upstream lockfile
        run: ./scripts/validate-manifest.sh
      - name: Check bootstrap scripts syntax
        run: bash -n scripts/bootstrap.sh scripts/verify.sh scripts/validate-manifest.sh
